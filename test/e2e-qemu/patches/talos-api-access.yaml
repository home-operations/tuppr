# How the upgrade pods reach the Talos API from inside the cluster: the presence
# of this document enables the service-account bridge with these grants. Talos
# rejects it on worker machines, so it is a control plane patch. This is the
# 1.14 document form; the old .machine.features.kubernetesTalosAPIAccess flag is
# deprecated there and no longer conveys the roles, which surfaces as upgrade
# pods getting "not authorized". The legacy leg boots 1.13, which does not know
# this kind, and keeps the v1alpha1 form next door.
apiVersion: v1alpha1
kind: KubeTalosAPIAccessConfig
allowedRoles:
  - os:admin
allowedKubernetesNamespaces:
  - tuppr-system
