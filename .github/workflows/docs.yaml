---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Docs

on:
  workflow_call:
    inputs:
      deploy:
        description: Publish the built site to GitHub Pages
        type: boolean
        required: true

# No workflow-level permissions: they would apply to publish as well, capping it
# at contents: read and starving actions/deploy-pages of pages: write and
# id-token: write. publish inherits the caller's grant instead; build declares
# its own reduction below, which is valid from either caller.

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          experimental: true
          install_args: --locked

      - name: Configure Pages
        if: ${{ inputs.deploy }}
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build docs site
        run: mise run docs

      - name: Upload artifact
        if: ${{ inputs.deploy }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

  publish:
    name: Publish to GitHub Pages
    if: ${{ inputs.deploy }}
    needs:
      - build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
