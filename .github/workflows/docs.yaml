---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Docs

on:
  workflow_call:
    inputs:
      deploy:
        description: Publish the built site to GitHub Pages
        type: boolean
        required: true

# No workflow-level permissions: they would apply to publish as well, capping it
# at contents: read and starving actions/deploy-pages of pages: write and
# id-token: write. publish inherits the caller's grant instead; build declares
# its own reduction below, which is valid from either caller.

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # withastro/action otherwise builds with its own default Node and the
      # newest pnpm; mise's pins are the versions `mise run docs` uses locally.
      - name: Setup Mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: false

      - name: Resolve toolchain versions
        id: tools
        run: |
          echo "node=$(mise config get tools.node)" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(mise config get tools.pnpm)" >> "$GITHUB_OUTPUT"

      # Uploads the Pages artifact on every run; only publish deploys it.
      - name: Build docs site
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          path: ./docs
          node-version: ${{ steps.tools.outputs.node }}
          package-manager: pnpm@${{ steps.tools.outputs.pnpm }}

  publish:
    name: Publish to GitHub Pages
    if: ${{ inputs.deploy }}
    needs:
      - build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
