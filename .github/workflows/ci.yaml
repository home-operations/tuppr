---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".release-please-manifest.json"
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=helm-unittest/helm-unittest
  HELM_UNITTEST_VERSION: "v1.1.2"

jobs:
  docs:
    if: ${{ github.event_name != 'push' }}
    name: Docs
    uses: ./.github/workflows/docs.yaml
    permissions:
      contents: read
    with:
      deploy: false

  go-e2e:
    if: >-
      ${{ github.event_name != 'push'
      && !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Go E2E (${{ matrix.upgrade }} ${{ matrix.leg }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      # The legs are independent local clusters, so a failure in one should not
      # cost us the signal from the other.
      fail-fast: false
      matrix:
        # Each entry runs on its own runner, so legs are cheap to add. What is
        # bounded is the VM count within one leg, at 2GiB per VM on a 16GB
        # runner. `leg` is a document in test/e2e-qemu describing the shape to
        # boot; `upgrade` is which controller that leg drives.
        #
        # Shape is what makes the Talos legs differ from each other: that
        # controller drains, reboots and upgrades node by node. The Kubernetes
        # one picks a single control plane node and runs one job there, so it
        # gets one leg rather than a shape sweep of its own.
        include:
          # Covers the self-hosted path: with one node tuppr upgrades the node
          # it is running on, so it skips the drain and issues the upgrade
          # without --wait. No other leg reaches that code.
          - leg: 1cp-0w
            upgrade: talos
          - leg: 1cp-1w
            upgrade: talos
          - leg: 3cp-0w
            upgrade: talos
          # A control plane and a worker, so both kinds of kubelet have to
          # converge on the new version before the CR reports Completed.
          - leg: 1cp-1w
            upgrade: kubernetes
    env:
      # Two names for one image in the runner-local registry. The nodes pull
      # registry.e2e, which the Talos mirror in patches/registry.yaml points at
      # the bridge gateway; buildx pushes to the same registry over loopback.
      # The alias matters beyond taste: test.sh splits CONTROLLER_IMAGE on ':'
      # to get the Helm repo and tag, so a host:port form would parse wrong.
      CONTROLLER_IMAGE: registry.e2e/tuppr:e2e
      PUSH_IMAGE: localhost:5000/tuppr:e2e
      # test.sh packages the chart, pushes it here, and installs it back over
      # OCI, so the run exercises the distributed artifact rather than the
      # working tree. Same runner-local registry as the image, over loopback, so
      # helm talks to it as plain HTTP.
      CHART_REGISTRY: oci://localhost:5000/charts
    defaults:
      run:
        working-directory: test/e2e-qemu
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          experimental: true
          install_args: --locked

      # Host prep is ours to do: the cluster action provisions and nothing else.
      - name: Install QEMU
        run: |-
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf

      # Headroom for the upgrade phase, when each node unpacks the installer
      # alongside etcd and the API server. Its own file, so it adds to the
      # runner's existing swap instead of replacing it.
      - name: Enable swap
        run: |-
          sudo fallocate -l 8G /mnt/e2e-swapfile
          sudo chmod 600 /mnt/e2e-swapfile
          sudo mkswap /mnt/e2e-swapfile
          sudo swapon /mnt/e2e-swapfile

      - name: Resolve toolchain versions
        id: tools
        working-directory: .
        run: echo "go=$(mise config get tools.go)" >> "$GITHUB_OUTPUT"

      - name: Start image registry
        run: docker run -d --name e2e-registry -p 5000:5000 registry:3

      # Booting the VMs and building the controller share no inputs, so they
      # overlap. They do contend for the runner's 4 vCPUs, so the saving is
      # less than the build time, but the build leaves the critical path.
      #
      # The config path is relative to the workspace: defaults.run applies to
      # run steps only. talosctl comes from mise, whose shim the action unwraps
      # itself, because the QEMU provisioner runs under sudo.
      - name: Create cluster
        id: cluster
        background: true
        uses: home-operations/talosctl-cluster-action@97d173e2efba3ec61abbfdf0fbd78ed848608190 # v0.1.4
        with:
          config: test/e2e-qemu/${{ matrix.leg }}.yaml

      # network=host so the builder container can reach the registry published
      # on the runner's loopback.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: network=host

      # Every leg builds a byte-identical image, so they share one cache scope.
      # Only one writes it back: concurrent cache-to writes to the same scope
      # evict each other. 3cp-0w is unique across the matrix, so it names one leg.
      - name: Build controller image
        id: image
        background: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ env.PUSH_IMAGE }}
          build-args: GO_VERSION=${{ steps.tools.outputs.go }}
          cache-from: type=gha,scope=e2e-controller
          cache-to: ${{ matrix.leg == '3cp-0w' && 'type=gha,mode=max,scope=e2e-controller' || '' }}

      - wait: [cluster, image]

      # The action exports KUBECONFIG and TALOSCONFIG too, but naming the outputs
      # keeps it visible which cluster the tests are pointed at, and test.sh
      # refuses to run against one it cannot identify.
      - name: Run e2e tests
        env:
          UPGRADE_KIND: ${{ matrix.upgrade }}
          CLUSTER_NAME: ${{ steps.cluster.outputs.cluster-name }}
          ENDPOINT: ${{ steps.cluster.outputs.endpoint }}
          KUBECONFIG: ${{ steps.cluster.outputs.kubeconfig }}
          TALOSCONFIG: ${{ steps.cluster.outputs.talosconfig }}
        run: mise exec --locked --no-deps -- ./test.sh

  go-lint:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Go Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          experimental: true
          install_args: --locked

      - name: Cache Go modules and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Cache golangci-lint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-lint-${{ hashFiles('go.sum', '.golangci.yml') }}
          restore-keys: ${{ runner.os }}-golangci-lint-

      - name: Run linter
        run: mise run lint

  go-test:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Go Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          experimental: true
          install_args: --locked

      - name: Cache Go modules and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Check go.mod tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Running Unit Tests
        run: mise run test

      - name: Running Integration Tests
        run: mise run test-integration

  helm-lint:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Helm Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          experimental: true
          install_args: --locked

      - name: Run helm lint
        run: mise run helm-lint

  helm-unittest:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Helm Unittest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Mise and required tools
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          experimental: true
          install_args: --locked

      - name: Run helm unit tests
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version "${HELM_UNITTEST_VERSION}" --verify=false
          mise run helm-test

      - name: Check chart docs are current
        run: mise run helm-docs-check

  workflow-lint:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Workflow Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false

      - name: Resolve linter versions
        id: tools
        run: |
          echo "actionlint=$(mise config get tools.actionlint)" >> "$GITHUB_OUTPUT"
          echo "zizmor=$(mise config get tools.zizmor)" >> "$GITHUB_OUTPUT"

      - name: Lint workflows
        uses: home-operations/.github/actions/workflow-lint@dfa0b198336d33dcbe73557a68315d3071ec7709 # workflow-lint-1.0.0
        with:
          actionlint-version: ${{ steps.tools.outputs.actionlint }}
          zizmor-version: ${{ steps.tools.outputs.zizmor }}

  status:
    if: ${{ !cancelled() }}
    name: Build Success
    needs:
      - docs
      - go-e2e
      - go-lint
      - go-test
      - helm-lint
      - helm-unittest
      - workflow-lint
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: |
          exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: |
          echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
