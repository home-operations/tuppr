---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".release-please-manifest.json"
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=helm-unittest/helm-unittest
  HELM_UNITTEST_VERSION: "v1.1.2"

  # The tag e2e-image builds under and every leg pushes to its own runner-local
  # registry. The nodes pull the registry.e2e name instead (see the go-e2e env),
  # which the Talos mirror in patches/registry.yaml points at port 5000 on the
  # bridge gateway. The split matters beyond taste: test.sh splits
  # CONTROLLER_IMAGE on ':' for the Helm repo and tag, so the host:port push form
  # would parse wrong there.
  PUSH_IMAGE: localhost:5000/tuppr:e2e

jobs:
  docs:
    if: ${{ github.event_name != 'push' }}
    name: Docs
    uses: $/.github/workflows/docs.yaml
    permissions:
      contents: read
    with:
      deploy: false

  # Built once and handed to every e2e leg, so they all install identical bytes
  # instead of four builds racing one GHA cache scope.
  e2e-image:
    if: >-
      ${{ github.event_name != 'push'
      && !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: E2E Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Nothing here runs a pinned tool; the build happens inside Docker and only
      # the Go version is read back out of the config.
      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      - name: Resolve toolchain versions
        id: tools
        run: echo "go=$(mise config get tools.go)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # load: true rather than a push: this job owns no registry, and one docker
      # save is what the legs get handed. One writer per scope now, so cache-to
      # is unconditional.
      - name: Build controller image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: ${{ env.PUSH_IMAGE }}
          build-args: GO_VERSION=${{ steps.tools.outputs.go }}
          cache-from: type=gha,scope=e2e-controller
          cache-to: type=gha,mode=max,scope=e2e-controller

      # gzip because the daemon may export layers uncompressed depending on its
      # image store, and docker load reads either. shell: bash for the pipefail
      # the implicit `bash -e` default lacks -- a failed save would otherwise
      # leave gzip's exit status to pass the step and hand every leg a truncated
      # tarball.
      - name: Export the image
        shell: bash
        run: docker save "${PUSH_IMAGE}" | gzip -1 > "${RUNNER_TEMP}/e2e-image.tar.gz"

      - name: Upload the image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-image
          path: ${{ runner.temp }}/e2e-image.tar.gz
          retention-days: 1

  go-e2e:
    if: >-
      ${{ github.event_name != 'push'
      && !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Go E2E (${{ matrix.upgrade }} ${{ matrix.leg }})
    needs: e2e-image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      # The legs are independent local clusters, so a failure in one should not
      # cost us the signal from the other.
      fail-fast: false
      matrix:
        # Each entry runs on its own runner, so legs are cheap to add. What is
        # bounded is the VM count within one leg, at 2GiB per VM on a 16GB
        # runner. `leg` is a document in test/e2e-qemu describing the shape to
        # boot; `upgrade` is which controller that leg drives.
        #
        # Shape is what makes the Talos legs differ from each other: that
        # controller drains, reboots and upgrades node by node. The Kubernetes
        # one picks a single control plane node and runs one job there, so it
        # gets one leg rather than a shape sweep of its own.
        include:
          # Every Talos leg boots the last 1.14 release candidate and upgrades
          # it to the release: the same-minor step clusters take repeatedly.
          # The action's floor is Talos 1.14, so nothing older can boot to
          # upgrade from.
          #
          # Covers the self-hosted path: with one node tuppr upgrades the node
          # it is running on, so it skips the drain and issues the upgrade
          # without --wait. No other leg reaches that code.
          - leg: 1cp-0w
            upgrade: talos
          - leg: 1cp-1w
            upgrade: talos
          - leg: 3cp-0w
            upgrade: talos
          # A control plane and a worker, so both kinds of kubelet have to
          # converge on the new version before the CR reports Completed. Boots
          # the release, since no Talos upgrade happens here.
          - leg: k8s-1cp-1w
            upgrade: kubernetes
    env:
      # What the chart is pointed at, and so what the nodes pull: the other half
      # of the two-names-for-one-image split described on the PUSH_IMAGE var
      # above.
      CONTROLLER_IMAGE: registry.e2e/tuppr:e2e
      # test.sh packages the chart, pushes it here, and installs it back over
      # OCI, so the run exercises the distributed artifact rather than the
      # working tree. Same runner-local registry as the image, over loopback, so
      # helm talks to it as plain HTTP.
      CHART_REGISTRY: oci://localhost:5000/charts
    defaults:
      run:
        working-directory: test/e2e-qemu
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: --locked

      # Host prep is ours to do: the cluster action provisions and nothing else.
      - name: Install QEMU
        run: |-
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf

      # Headroom for the upgrade phase, when each node unpacks the installer
      # alongside etcd and the API server. Its own file, so it adds to the
      # runner's existing swap instead of replacing it.
      - name: Enable swap
        run: |-
          sudo fallocate -l 8G /mnt/e2e-swapfile
          sudo chmod 600 /mnt/e2e-swapfile
          sudo mkswap /mnt/e2e-swapfile
          sudo swapon /mnt/e2e-swapfile

      - name: Start image registry
        run: docker run -d --name e2e-registry -p 5000:5000 registry:3

      # Booting the VMs and filling the registry share no inputs, so they overlap
      # the way the build this leg used to run did.
      #
      # The config path is relative to the workspace: defaults.run applies to
      # run steps only. talosctl comes from mise, whose shim the action unwraps
      # itself, because the QEMU provisioner runs under sudo.
      - name: Create cluster
        id: cluster
        background: true
        uses: home-operations/talosctl-cluster-action@fb6a31bf5de43218acc80d2e23958a16eee7380c # v0.2.2
        with:
          config: test/e2e-qemu/${{ matrix.leg }}.yaml
          cache: true

      - name: Download the image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-image
          path: ${{ runner.temp }}

      # Straight into this leg's own registry, so the nodes still pull over
      # loopback and nothing crosses the internet.
      - name: Load the image into the registry
        run: |
          docker load -i "${RUNNER_TEMP}/e2e-image.tar.gz"
          docker push "${PUSH_IMAGE}"

      - wait: [cluster]

      # The action exports KUBECONFIG and TALOSCONFIG too, but naming the outputs
      # keeps it visible which cluster the tests are pointed at, and test.sh
      # refuses to run against one it cannot identify.
      - name: Run e2e tests
        env:
          UPGRADE_KIND: ${{ matrix.upgrade }}
          CLUSTER_NAME: ${{ steps.cluster.outputs.cluster-name }}
          ENDPOINT: ${{ steps.cluster.outputs.endpoint }}
          KUBECONFIG: ${{ steps.cluster.outputs.kubeconfig }}
          TALOSCONFIG: ${{ steps.cluster.outputs.talosconfig }}
        run: mise exec --locked --no-deps -- ./test.sh

  go-lint:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Go Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: --locked

      - name: Cache Go modules and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      # This cache holds analyzer facts (staticcheck's "does this call
      # return?"), so a stale or partial entry does not just cost time -- it
      # turns checks like SA5011 into false positives on untouched code. Hence
      # the lock file in the key, so a golangci-lint or Go bump starts fresh
      # rather than inheriting the previous binary's facts, and no restore-keys:
      # a miss must start cold instead of falling back to the newest entry
      # under the prefix, which is how one bad entry outlives its own commit.
      - name: Cache golangci-lint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-lint-${{ hashFiles('go.sum', '.golangci.yml', '.mise/mise.lock') }}

      - name: Run linter
        run: mise run lint

  go-test:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Go Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: --locked

      - name: Cache Go modules and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Check go.mod tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Running Unit Tests
        run: mise run test

      - name: Running Integration Tests
        run: mise run test-integration

  go-vulncheck:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Go Vulncheck
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: --locked

      - name: Run govulncheck
        run: mise run vulncheck

  helm-lint:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Helm Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: --locked

      - name: Run helm lint
        run: mise run helm-lint

  helm-unittest:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Helm Unittest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Mise and required tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: --locked

      - name: Run helm unit tests
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version "${HELM_UNITTEST_VERSION}" --verify=false
          mise run helm-test

      - name: Check chart docs are current
        run: mise run helm-docs-check

  workflow-lint:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Workflow Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      - name: Resolve linter versions
        id: tools
        run: |
          echo "actionlint=$(mise config get tools.actionlint)" >> "$GITHUB_OUTPUT"
          echo "zizmor=$(mise config get tools.zizmor)" >> "$GITHUB_OUTPUT"

      - name: Lint workflows
        uses: home-operations/.github/actions/workflow-lint@69cad1e407df8070dd9cfc3314551e473544014e # workflow-lint-v1.0.3
        with:
          actionlint-version: ${{ steps.tools.outputs.actionlint }}
          zizmor-version: ${{ steps.tools.outputs.zizmor }}

  status:
    if: ${{ !cancelled() }}
    name: Build Success
    needs:
      - docs
      - e2e-image
      - go-e2e
      - go-lint
      - go-test
      - go-vulncheck
      - helm-lint
      - helm-unittest
      - workflow-lint
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      # cancelled counts as failed: !cancelled() above still runs this job when
      # individual needs were cancelled but the run was not, and a required job
      # that never reached a verdict must not clear the merge gate.
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: |
          echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
